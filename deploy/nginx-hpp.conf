# Proxy /api/* ke backend elio-hpp-backend (PM2, port lihat backend/.env PORT).
# Deploy ke: /www/server/panel/vhost/nginx/extension/hpp.eliodigihub.my.id/hpp-app.conf
# (nama folder HARUS sama persis dengan nama site aaPanel saat ini — kalau
# site dihapus/dibuat ulang dengan nama beda, config ini jadi yatim, lihat
# gotcha soal ini di STATUS_MIGRASI.md).
#
# INI BUKAN file server{} lengkap -- di-include oleh vhost config aaPanel
# yang sudah ada untuk domain ini, jangan pasang sebagai site baru.

location /api/ {
    proxy_pass http://127.0.0.1:3904/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tanpa header ini, browser bebas cache app.js/apiClient.js pakai heuristik
# sendiri (tidak ada Cache-Control default dari aaPanel untuk static file) --
# ketauan langsung di sesi migrasi ini: tab BARU sekalipun masih dapat
# apiClient.js versi lama setelah di-deploy ulang. must-revalidate maksa
# browser selalu cek ulang ke server (boleh tetap pakai cache kalau server
# bilang belum berubah lewat 304), bukan diam-diam pakai cache basi.
location ~* \.(?:html|js)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
